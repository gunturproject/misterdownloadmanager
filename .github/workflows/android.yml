name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 defaults to the legacy `tools` package, which Google no longer ships.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Expose the NDK to cargo-ndk
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # rquickjs-sys generates QuickJS bindings from C headers on Android.
      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # Cargo.lock is refreshed here on purpose: mdm-android is a new member.
      - name: Build native libraries
        run: >-
          cargo ndk
          -t arm64-v8a
          -t armeabi-v7a
          -t x86_64
          -o android/app/src/main/jniLibs
          build --release -p mdm-android

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mdm-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
