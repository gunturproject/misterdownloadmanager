[package]
name = "mdm-android"
description = "JNI bridge: the MDM download engine as a native Android library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "mdm_android"
crate-type = ["cdylib"]

[dependencies]
# The engine without the desktop browser-like connection: that feature builds
# BoringSSL from C and is not used by the mobile port.
mdm-engine = { workspace = true, default-features = false }
# Same jni major as rustls-platform-verifier 0.7.x (0.22), so both can share
# the global JavaVM and the Android certificate verifier can be initialized.
jni = "0.22.4"
rustls-platform-verifier.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[lints]
workspace = true
